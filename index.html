<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tuteur IA — Espace d'apprentissage</title>
  <style>
    :root {
      --bg: #f3f4ff;
      --panel: #ffffff;
      --primary: #4f46e5;
      --primary-soft: #eef2ff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --ok: #16a34a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top left, #dbeafe 0%, var(--bg) 45%, #eef2ff 100%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(1100px, 100%);
      height: min(760px, calc(100vh - 48px));
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 300px 1fr;
      box-shadow: 0 18px 60px rgba(79, 70, 229, 0.15);
    }

    .sidebar {
      border-right: 1px solid var(--border);
      background: #fafaff;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .brand {
      display: flex;
      gap: 10px;
      align-items: center;
      font-weight: 700;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--primary);
      color: white;
      font-size: 18px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: white;
    }

    .topic-btn {
      width: 100%;
      text-align: left;
      border: 1px solid var(--border);
      background: white;
      border-radius: 10px;
      padding: 10px;
      margin-top: 8px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .topic-btn:hover,
    .topic-btn.active {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .main {
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
    }

    .badge {
      border: 1px solid #bbf7d0;
      color: var(--ok);
      background: #f0fdf4;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    #chat {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: linear-gradient(#fff, #fcfcff);
    }

    .msg {
      max-width: 78%;
      padding: 12px 14px;
      border-radius: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .msg.ai {
      align-self: flex-start;
      background: #f8fafc;
      border: 1px solid var(--border);
    }

    .msg.user {
      align-self: flex-end;
      background: var(--primary);
      color: white;
    }

    .composer {
      border-top: 1px solid var(--border);
      padding: 14px;
      display: flex;
      gap: 10px;
    }

    #input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font: inherit;
      outline: none;
    }

    #input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.14);
    }

    button.send {
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      padding: 0 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .small { color: var(--muted); font-size: 13px; margin: 0; }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; height: auto; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
      .msg { max-width: 92%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">🤖</div>
        <div>
          Tuteur IA
          <p class="small">Accompagnement personnalisé</p>
        </div>
      </div>

      <section class="card">
        <strong>Progression</strong>
        <p class="small" id="progress">3/10 compétences validées</p>
      </section>

      <section class="card">
        <strong>Choisir une matière</strong>
        <button class="topic-btn active" data-topic="maths">Mathématiques</button>
        <button class="topic-btn" data-topic="français">Français</button>
        <button class="topic-btn" data-topic="sciences">Sciences</button>
      </section>

      <section class="card">
        <strong>Conseil du jour</strong>
        <p class="small">Pose une question précise pour obtenir une meilleure réponse.</p>
      </section>
    </aside>

    <section class="main">
      <header class="header">
        <div>
          <h1 style="margin:0; font-size:1.1rem;">Session de tutorat en direct</h1>
          <p class="small" id="topicLabel">Matière actuelle : Mathématiques</p>
        </div>
        <span class="badge">IA en ligne</span>
      </header>

      <div id="chat" aria-live="polite"></div>

      <form class="composer" id="chatForm">
        <input id="input" type="text" placeholder="Ex: Peux-tu m'expliquer les fractions simplement ?" required />
        <button class="send" type="submit">Envoyer</button>
      </form>
    </section>
  </main>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const topicLabel = document.getElementById('topicLabel');
    const topicButtons = document.querySelectorAll('.topic-btn');

    let currentTopic = 'maths';

    const intros = {
      maths: "Bonjour 👋 Je suis ton tuteur IA en mathématiques. Donne-moi ton niveau et un exercice que tu trouves difficile.",
      français: "Salut 👋 Je peux t'aider en français: grammaire, orthographe, rédaction ou commentaire de texte.",
      sciences: "Bonjour 👋 En sciences, je peux expliquer les notions étape par étape avec des exemples concrets."
    };

    function addMessage(role, text) {
      const el = document.createElement('article');
      el.className = `msg ${role}`;
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    function generateTutorReply(question) {
      const q = question.toLowerCase();
      if (currentTopic === 'maths') {
        if (q.includes('fraction')) return "Très bonne question. 1) Mets les fractions au même dénominateur. 2) Additionne les numérateurs. 3) Simplifie le résultat.\nVeux-tu que je te montre avec 2/3 + 1/6 ?";
        if (q.includes('équation') || q.includes('equation')) return "Pour résoudre une équation, isole l'inconnue: fais la même opération des deux côtés jusqu'à obtenir x = ...\nEnvoie-moi ton équation et je te guide pas à pas.";
      }
      if (currentTopic === 'français') {
        if (q.includes('accord')) return "Astuce accord: trouve le noyau du groupe nominal, puis vérifie genre + nombre.\nÉcris ta phrase et je la corrige avec explication.";
      }
      if (currentTopic === 'sciences') {
        if (q.includes('cellule')) return "Une cellule est l'unité de base du vivant. Retenir: membrane, cytoplasme, noyau (chez eucaryotes).\nJe peux te faire une fiche mémo en 5 lignes.";
      }
      return "Bonne question. Je te propose: définition rapide, exemple concret, mini-exercice, puis correction. Dis-moi ton niveau (collège, lycée, supérieur) pour adapter la difficulté.";
    }

    topicButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        topicButtons.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        currentTopic = btn.dataset.topic;
        topicLabel.textContent = `Matière actuelle : ${btn.textContent}`;
        addMessage('ai', intros[currentTopic]);
      });
    });

    document.getElementById('chatForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      addMessage('user', question);
      input.value = '';

      setTimeout(() => {
        addMessage('ai', generateTutorReply(question));
      }, 350);
    });

    addMessage('ai', intros[currentTopic]);
  </script>
</body>
</html>
